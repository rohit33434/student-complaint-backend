spring.application.name=smartcampus

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/student_complaint_db}
spring.datasource.username=${DB_USERNAME:rohit}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Server
server.port=${PORT:8080}

# JWT
jwt.secret=${JWT_SECRET:dev-secret-key-at-least-32-chars-long-for-hs256}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Email
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:test@example.com}
spring.mail.password=${MAIL_PASSWORD:test-password}
spring.mail.from=${MAIL_FROM:noreply@smartcampus.edu}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.default-encoding=UTF-8
